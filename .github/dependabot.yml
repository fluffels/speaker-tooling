# Dependabot: hält die npm-Abhängigkeiten und die GitHub-Actions aktuell und öffnet Security-Update-PRs,
# sobald ein Advisory bekannt wird. GitHub-nativ, kein externer Dienst.
#
# Gekoppelte Pakete kommen in EINEM PR, damit keine inkonsistenten Versionen entstehen (ein halbes
# Major-Upgrade der eslint-Familie wäre rot). Ein Paket landet in der ERSTEN Gruppe, deren patterns passen:
# darum die Familien-Gruppen vor der allgemeinen Minor/Patch-Sammelgruppe. Gruppieren ist kein Auto-Merge,
# ein roter Gruppen-PR wird geprüft. Sonstige Majors fallen aus der Sammelgruppe und kommen einzeln.
# Cooldown: neue Versionen werden 7 Tage nach Veröffentlichung nicht vorgeschlagen (Lieferketten-Schutz gegen frisch
# gekaperte Releases). Security-Updates (Advisories) sind davon ausgenommen und kommen ohne Verzögerung (Dependabot-Doku, `cooldown`).
version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    cooldown:
      default-days: 7
    groups:
      eslint:
        patterns:
          - "eslint"
          - "@eslint/*"
          - "@eslint-community/*"
          - "eslint-*"
          - "typescript-eslint"
          - "@typescript-eslint/*"
        update-types:
          - "major"
          - "minor"
          - "patch"
      vitest:
        patterns:
          - "vitest"
          - "@vitest/*"
        update-types:
          - "major"
          - "minor"
          - "patch"
      npm-minor-patch:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
    commit-message:
      prefix: "chore(deps)"
      prefix-development: "chore(deps-dev)"
    # Der TypeScript-Major (ab 7) bleibt außen vor, solange kein veröffentlichtes typescript-eslint ihn
    # trägt (harter Peer unter 6.1.0): sonst käme er wöchentlich als dauerhaft roter PR.
    # Ein Eintrag in der Wiedervorlagen-Datei des Projekts kann zum Fälligkeitstag ein Ticket anlegen,
    # das dieses `ignore` prüfen und lösen lässt.
    ignore:
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]

  # Eine Gruppe über alle Action-Updates (auch major): Action-Bumps sind klein und als Batch gut zu prüfen.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    cooldown:
      default-days: 7
    groups:
      github-actions:
        patterns:
          - "*"
        update-types:
          - "major"
          - "minor"
          - "patch"
    commit-message:
      prefix: "ci(actions)"

  # --- Projekt-Einträge (Produkt, #11) ---
  # Backend: Parent-POM in /backend, das Modul app hängt über <modules> daran. Majors kommen einzeln.
  - package-ecosystem: "maven"
    directory: "/backend"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    cooldown:
      default-days: 7
    groups:
      maven-minor-patch:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
    commit-message:
      prefix: "chore(deps)"

  # Frontend: Angular-Familie samt vitest (@angular/build bindet vitest per Peer) in EINEM PR, dann die Sammelgruppe.
  - package-ecosystem: "npm"
    directory: "/frontend"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    cooldown:
      default-days: 7
    groups:
      frontend-angular:
        patterns:
          - "@angular/*"
          - "@angular-devkit/*"
          - "@schematics/angular"
          - "vitest"
          - "@vitest/*"
        update-types:
          - "major"
          - "minor"
          - "patch"
      frontend-minor-patch:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
    commit-message:
      prefix: "chore(deps)"
      prefix-development: "chore(deps-dev)"
    # TypeScript folgt dem von Angular unterstützten Bereich (~6.0.2) und wird per `ng update` angehoben:
    # ein Alleingang von Dependabot käme als dauerhaft roter PR.
    ignore:
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]

  # Basis-Images der Dockerfiles. Java- und Node-Majors sind Stack-Entscheidungen (ADR 0001, .nvmrc), kein Auto-Vorschlag.
  - package-ecosystem: "docker"
    directories:
      - "/backend"
      - "/frontend"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    cooldown:
      default-days: 7
    commit-message:
      prefix: "chore(deps)"
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]

  # Images in docker-compose.yml. Ein Postgres-Major macht das Datenverzeichnis inkompatibel (Migration nötig).
  - package-ecosystem: "docker-compose"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    cooldown:
      default-days: 7
    commit-message:
      prefix: "chore(deps)"
    ignore:
      - dependency-name: "postgres"
        update-types: ["version-update:semver-major"]
