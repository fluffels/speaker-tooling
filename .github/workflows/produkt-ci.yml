# Produkt-CI: baut und testet das Java-Backend mit Maven (./mvnw verify, inklusive Testcontainers-Integrationstests)
# und das Angular-Frontend (ng build, ng test); der Frontend-Audit prüft frontend/package-lock.json auf Advisories (high).
# Läuft auf jedem PR ohne Pfadfilter; der Job Produkt-CI ist Required Check im Ruleset main-schutz. Die Harness-Gates laufen in ci.yml.
name: Produkt-CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: produkt-ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  backend:
    name: Backend (Maven verify)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Java 25 einrichten
        uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: "25"
          cache: maven
          cache-dependency-path: backend/**/pom.xml

      - name: Backend bauen und testen
        working-directory: backend
        run: ./mvnw -B verify

  frontend:
    name: Frontend (ng build, ng test)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Node einrichten
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Abhängigkeiten installieren
        run: npm ci

      - name: Frontend bauen
        run: npx ng build

      - name: Frontend testen
        run: npx ng test --watch=false

  frontend-audit:
    # Eigener Name, nie "Security-Audit (npm audit)": das ist der Required Check aus ci.yml (Root-Lockfile).
    name: Frontend-Audit (npm audit)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Node einrichten
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc

      - name: Lockfile auditieren (high, inklusive Dev-Abhängigkeiten)
        run: npm audit --audit-level=high

  produkt-ci:
    # Required Check im Ruleset main-schutz (#9): grün nur, wenn jeder Job in needs success meldet.
    # Neuer Produkt-Job: hier in needs eintragen, sonst blockiert er den Merge nicht.
    name: Produkt-CI
    needs:
      - backend
      - frontend
      - frontend-audit
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Ergebnisse der Produkt-Jobs prüfen
        env:
          ERGEBNISSE: ${{ toJSON(needs) }}
        run: |
          echo "$ERGEBNISSE" | jq -r 'to_entries[] | "\(.key): \(.value.result)"'
          echo "$ERGEBNISSE" | jq -e 'length > 0 and all(.[]; .result == "success")' > /dev/null
