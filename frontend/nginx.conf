# Statische Auslieferung der Angular-App; /api/ geht an das Backend (ein Origin, kein CORS).
# Der Upstream wird je Anfrage über den Docker-DNS (127.0.0.11) aufgelöst: der Container startet auch ohne Backend,
# und nach einem Neustart des Backends (neue IP) findet nginx es wieder. Fehlt das Backend, kommt nach höchstens 3 s ein 502.
server {
  listen 8080;
  server_tokens off;
  root /usr/share/nginx/html;
  resolver 127.0.0.11 valid=10s ipv6=off;

  location /api/ {
    set $backend http://backend:8080;
    proxy_pass $backend;
    proxy_connect_timeout 3s;
  }

  location / {
    try_files $uri $uri/ /index.html;
  }
}
